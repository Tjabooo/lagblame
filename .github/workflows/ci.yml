name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build deps (clang for the BPF program, libelf/zlib for libbpf)
        run: sudo apt-get update && sudo apt-get install -y clang libelf-dev zlib1g-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  vm:
    # loads the BPF programs into a real kernel (the runner's own) inside a VM
    # and checks the three staged lag sources get blamed right
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libelf-dev zlib1g-dev pkg-config qemu-system-x86 cpio libcap2-bin
          sudo chmod 666 /dev/kvm
          sudo cp /boot/vmlinuz-$(uname -r) /tmp/vmlinuz && sudo chmod 644 /tmp/vmlinuz
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - run: tests/vm/run.sh /tmp/vmlinuz target/release/lagblame
